[workspace]
# Qt direction (2026-09-22): the workspace is the engine (core + FFI)
# plus the CLI acceptance harness. egui/gtk/macos shells were archived
# to source/backups/catalog-frozen-crates-* (re-add to members to build).
members = [
    "crates/catalog-core",
    "crates/catalog-cli",
    "crates/catalog-ffi",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
zip = "2"
regex = "1"
# 0.10, not 0.11: smb's pre-release crypto tree (digest/hmac/sha2
# release-candidates) conflicts with stable sha2 0.11's digest 0.11.
sha2 = "0.10"
image = "0.25"
tokio = { version = "1", features = ["full"] }
directories = "6"
clap = { version = "4", features = ["derive"] }
# Default features include async(tokio) + sign + encrypt + compress — all
# needed against modern Samba (signing often mandatory).
smb = "0.11"
async-trait = "0.1"
russh = "0.52"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
dispatch2 = "0.3"
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
gtk = { package = "gtk4", version = "0.9" }
relm4 = "0.9"
