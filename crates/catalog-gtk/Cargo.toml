[package]
name = "catalog-gtk"
version = "0.1.0"
edition = "2021"

[dependencies]
catalog-core = { path = "../catalog-core" }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.9" }
relm4 = "0.9"
glib = "0.20"
gdk-pixbuf = "0.20"

# Tracks trixie system GTK 4.18.6 — no vendoring, dynamic link (LGPL).
# Non-Linux hosts build a stub (core probe only) so `cargo test --workspace`
# stays green on macOS/Windows without GTK dev headers.
